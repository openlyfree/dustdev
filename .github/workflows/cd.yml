name: CD

# Publish pipeline for main. Builds the three container images and pushes them
# to GHCR as both `production` (mutable, what the droplet runs) and the commit
# SHA (immutable, for rollback), and produces the static frontend bundle.
#
# Nothing here touches the droplet. Deploy by running deploy/deploy.sh on the
# server (see deploy/README.md).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # e.g. ghcr.io/ethan/code-az (lower-cased; GHCR forbids uppercase)
  IMAGE_NAMESPACE: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}
  GO_VERSION: "1.26"

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: Build + push ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: frontbackend, context: frontbackend, file: frontbackend/Containerfile }
          - { name: caddy, context: deploy/caddy, file: deploy/caddy/Containerfile }
          - { name: idehost, context: ide, file: ide/Containerfile }
    steps:
      - uses: actions/checkout@v4

      # The idehost build compiles its frontend with Bun outside Docker's cache
      # awareness; give BuildKit a registry-backed cache so rebuilds stay fast.
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ env.IMAGE_NAMESPACE }}-${{ matrix.name }}:production
            ${{ env.IMAGE_NAMESPACE }}-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  frontend:
    name: Build + upload frontend bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontfrontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
      - name: Package static bundle
        run: tar -C build -czf "${{ runner.temp }}/frontend.tar.gz" .
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend
          path: ${{ runner.temp }}/frontend.tar.gz
          retention-days: 30
